services:
  - type: web
    name: dust-studio
    env: python
    region: singapore # hoặc oregon / frankfurt
    plan: free
    buildCommand: "pip install --upgrade pip && pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install --no-cache-dir -r web_demo/requirements.txt"
    startCommand: "cd web_demo && uvicorn app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: PYTHONUNBUFFERED
        value: "1"
